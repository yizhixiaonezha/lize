name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 查看当前目录结构（调试用）
        run: |
          pwd
          ls -la
      
      - name: 查看 web 目录是否存在（调试用）
        run: |
          ls -la web || echo "web 目录不存在"
      
      - name: 安装依赖
        run: |
          cd web
          npm ci
      
      - name: 构建项目
        run: |
          cd web
          npm run build
      
      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
